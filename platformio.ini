; PlatformIO Project Configuration File
;
; ESP32-S3 camera client using the same TCP JPEG protocol as ../spycam.

[env:esp32s3cam]
platform = espressif32@6.7.0
board = goouuu_esp32_s3_cam
framework = arduino

upload_protocol = esptool
monitor_speed = 115200

monitor_dtr = 0
monitor_rts = 0

; Warnings apply to src/ only; the bundled WiFi and esp32-camera sources are noisy.
build_src_flags = -Wall -Wextra -Wformat=2

; -Wconversion -Wsign-conversion are deliberately absent, measured rather than
; assumed. Enabling both produced only 2 warnings in this project's own code
; (one line in src/CameraManager.cpp, since fixed by typing the frame-buffer
; count constants as size_t) but 30 more from Arduino core headers that src/
; includes and this repo cannot edit: WString.h, portmacro.h, and cpu_hal.h.
; Keeping the flags would therefore mean either tolerating those 30 warnings on
; every build or adding a build script that re-passes every framework include
; path as -isystem, which is a lot of machinery for two findings.

lib_deps =
	espressif/esp32-camera@^2.0.4

[env:native]
platform = native
test_build_src = false

; Match the Arduino core's -std=gnu++11 so host tests catch what the firmware would.
build_flags = -std=gnu++11 -Wall -Wextra -Wformat=2
